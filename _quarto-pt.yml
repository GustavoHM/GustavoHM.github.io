# Versão em português — renderizada em /pt/ (perfil "pt").
# Renderiza apenas a pasta pt/ em _site-pt; o build.sh copia o resultado
# para _site/pt/ depois de renderizar a versão em inglês.
project:
  output-dir: _site-pt
  render:
    - "pt/"

website:
  search: false
  # Rascunhos (draft: true) aparecem nas listagens — útil durante a revisão.
  # Remover ao publicar a postagem.
  draft-mode: visible
  navbar:
    left:
      - href: pt/index.qmd
        text: Sobre
      - href: pt/pesquisa/index.qmd
        text: Pesquisa
      - href: pt/postagens/index.qmd
        text: Postagens
      - href: pt/ensino.qmd
        text: Ensino
      - href: pt/cv.qmd
        text: CV
    right:
      - text: "English"
        href: /
      - text: "日本語"
        href: /ja/
      - icon: envelope
        href: mailto:gustavo@gakusai.net
        aria-label: E-mail
      - icon: linkedin
        href: http://www.linkedin.com/pub/gustavo-hoffmann-moreira/29/109/210
        aria-label: LinkedIn
  page-footer:
    left: "© 2026 Gustavo Hoffmann Moreira"
    right: "Feito com [Quarto](https://quarto.org)"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    lang: pt-BR
