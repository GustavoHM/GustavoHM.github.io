[package]
name = "painel-site"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37.0"
egui_commonmark = "0.26.0"
egui_extras = { version = "0.37.0", features = ["image", "file"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
