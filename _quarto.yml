# Shared base configuration. Language-specific settings (navbar, footer,
# rendered files) live in _quarto-en.yml and _quarto-pt.yml.
# Build both versions with ./build.sh (EN at /, PT at /pt/).
project:
  type: website

profile:
  default: en

website:
  title: "Gustavo Hoffmann Moreira"
  description: "Personal academic website of Gustavo Hoffmann Moreira — PhD candidate in Organizations and Markets (Applied Economics), UFPel."
  # After creating the GitHub repository, set this to your GitHub Pages URL,
  # e.g. https://USERNAME.github.io or https://USERNAME.github.io/REPO
  # site-url: https://USERNAME.github.io

execute:
  freeze: auto
